<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Temperature in College Station</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/series-label.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <style>
        #temperature-chart {
            min-width: 310px;
            max-width: 800px;
            height: 400px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <div id="temperature-chart"></div>

    <script>
        Highcharts.chart('temperature-chart', {
            chart: {
                type: 'line'
            },
            title: {
                text: 'Weekly Temperature in College Station'
            },
            xAxis: {
                categories: ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
            },
            yAxis: {
                title: {
                    text: 'Temperature (°F)'
                }
            },
            legend: {
                layout: 'horizontal',
                align: 'center',
                verticalAlign: 'bottom'
            },
            series: [{
                name: 'Highest',
                data: [82, 81, 81, 70, 77, 78, 79, 80],
                color: '#7cb5ec',
                marker: {
                    symbol: 'circle'
                },
                dataLabels: {
                    enabled: true,
                    style: { fontWeight: 'bold', color: '#7cb5ec' }
                }
            }, {
                name: 'Lowest',
                data: [67, 59, 50, 47, 51, 60, 66, 66],
                color: 'black',
                marker: {
                    symbol: 'diamond'
                },
                dataLabels: {
                    enabled: true,
                    style: { fontWeight: 'bold', color: 'black' }
                }
            }]
        });
    </script>

</body>

</html>
