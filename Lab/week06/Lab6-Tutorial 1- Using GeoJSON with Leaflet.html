<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Leaflet GeoJSON Example-Sheida Ghahremani</title>

    <link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        h2 {
            margin-left: 10px;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
        }

        .leaflet-container {
            height: 85%;
            width: 100%;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>

<body>
    <h2>Leaflet GeoJSON Example</h2>

    <div id='map'></div>

    <script src="sample-geojson.js" type="text/javascript"></script>

    <script>
        var map = L.map('map').setView([39.74739, -105], 13);

        var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var baseballIcon = L.icon({
            iconUrl: 'https://leafletjs.com/examples/geojson/baseball-marker.png',
            iconSize: [32, 37],
            iconAnchor: [16, 37],
            popupAnchor: [0, -28]
        });

        function onEachFeature(feature, layer) {
            var popupContent = `<p>I started out as a GeoJSON ${feature.geometry.type}, but now I'm a Leaflet vector!</p>`;

            if (feature.properties && feature.properties.popupContent) {
                popupContent += feature.properties.popupContent;
            }

            layer.bindPopup(popupContent);
        }

        var bicycleRentalLayer = L.geoJSON([bicycleRental, campus], {

            style: function (feature) {
                return feature.properties && feature.properties.style;
            },

            onEachFeature: onEachFeature,

            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, {
                    radius: 8,
                    fillColor: '#ff7800',
                    color: '#000',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                });
            }
        }).addTo(map);

        var freeBusLayer = L.geoJSON(freeBus, {

            filter: function (feature, layer) {
                if (feature.properties) {
                    return feature.properties.underConstruction !== undefined ? !feature.properties.underConstruction : true;
                }
                return false;
            },

            onEachFeature: onEachFeature
        }).addTo(map);

        var coorsLayer = L.geoJSON(coorsField, {

            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, { icon: baseballIcon });
            },

            onEachFeature: onEachFeature
        }).addTo(map);
    </script>

</body>

</html>
