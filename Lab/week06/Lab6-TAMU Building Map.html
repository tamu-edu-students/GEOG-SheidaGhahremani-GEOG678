<!DOCTYPE html>
<html>

<head>
    <title>Sheida Ghahremani TAMU Map</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="tamubuildings.js"></script>
    <style>
        #map {
            height: 700px;
        }

        .info {
            padding: 6px 8px;
            font: 14px Arial, sans-serif;
            background: white;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        h2 {
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <h2>Sheida Ghahremani TAMU Map</h2>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([30.6185, -96.3365], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function style(feature) {
            return {
                fillColor: 'maroon',
                weight: 2,
                opacity: 1,
                color: 'white',
                fillOpacity: 0.7
            };
        }

        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({
                weight: 3,
                color: '#666',
                fillOpacity: 1
            });
            info.update(layer.feature.properties);
        }

        function resetHighlight(e) {
            geojson.resetStyle(e.target);
            info.update();
        }

        function zoomToFeature(e) {
            map.fitBounds(e.target.getBounds());
        }

        function onEachFeature(feature, layer) {
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight,
                click: zoomToFeature
            });
        }

        var geojson = L.geoJson(tamu, {
            style: style,
            onEachFeature: onEachFeature
        }).addTo(map);

        var info = L.control();

        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };

        info.update = function (props) {
            this._div.innerHTML = '<h3>Building Name and Abbreviation</h3>' + (props ?
                '<b>' + props.BldgName + '</b><br />' + '</b><br />' + props.BldgAbbr
                : 'Hover over a building');
        };

        info.addTo(map);
    </script>
</body>

</html>
